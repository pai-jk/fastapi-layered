[project]
name = "fastapi-layered"
version = "0.1.0"
description = ""
authors = [{ name = "이준규", email = "dlwnsrb05@publicai.co.kr" }]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi (>=0.116.1,<0.117.0)",
    "uvicorn (>=0.35.0,<0.36.0)",
    "sqlalchemy (>=2.0.43,<3.0.0)",
    "pydantic-settings (>=2.10.1,<3.0.0)",
    "dependency-injector (>=4.48.1,<5.0.0)",
    "opentelemetry-api (>=1.36.0,<2.0.0)",
    "opentelemetry-sdk (>=1.36.0,<2.0.0)",
    "pytz (>=2025.2,<2026.0)",
    "opentelemetry-instrumentation (>=0.59b0,<0.60)",
    "opentelemetry-instrumentation-logging (>=0.59b0,<0.60)",
    "asyncpg (>=0.31.0,<0.32.0)",
    "aiomysql (>=0.3.2,<0.4.0)",
    "greenlet (>=3.2.4,<4.0.0)",
    "aiosqlite (>=0.21.0,<0.22.0)",
]

[dependency-groups]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-mock>=3.11.0",
    "pytest-cov>=4.1.0",
    "coverage>=7.4.0",
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
package-mode = false
# package-mode = true
# packages = [{include = "src"}]

[tool.poetry.group.dev.dependencies]
pytest = "^9.0.1"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = ["-v", "--tb=short", "--strict-markers", "--disable-warnings"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
]
